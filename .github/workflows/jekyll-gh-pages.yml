name: Publicar vitrine no GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o projeto
        uses: actions/checkout@v4

      - name: Validar catálogo e JavaScript
        run: |
          node ferramentas/validar-catalogo.cjs
          for arquivo in js/*.js admin/admin.js; do node --check "$arquivo"; done

      - name: Separar somente os arquivos públicos
        run: |
          mkdir -p _site
          cp index.html catalogo.html produto.html 404.html favicon.ico robots.txt sitemap.xml site.webmanifest _site/
          cp -R css data img js _site/
          touch _site/.nojekyll

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Enviar arquivos da vitrine
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v5
